[platformio]
default_envs = nano_new_bootloader
src_dir = ArduinoIDE/AgenticPipette

[env]
platform = atmelavr@5.1.0
framework = arduino
lib_deps = arduino-libraries/Servo@1.2.2
monitor_speed = 115200

; Many classic Nano clones use the old bootloader.
[env:nano_classic]
board = nanoatmega328
upload_speed = 57600

; Select this environment for a Nano with the newer bootloader.
[env:nano_new_bootloader]
board = nanoatmega328new
upload_speed = 115200
